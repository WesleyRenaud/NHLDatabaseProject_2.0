<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL DB</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../scripts/scripts.js" defer></script>
</head>
<body>
    <div id="top-container">
        <h1 id="nhl-db-title">NHL DB</h1>
        <div id="view-stats-button-container">
            <a href="/view-stats.html">
                <button id="view-stats-button">View Stats</button>
            </a>
        </div>
    </div>

    <div id="stat-adding-button-container">
        <a href="/add-skater.html">
            <button class="stat-adding-button" id="add-skater-button">Add Skater</button>
        </a>
        <a href="/add-goalie.html">
            <button class="stat-adding-button" id="add-goalie-button">Add Goalie</button>
        </a>        
        <a href="/add-team-regular-season.html">
            <button class="stat-adding-button" id="add-team-regular-season-button">Add Team Season</button>
        </a>
        <a href="/add-team-playoffs.html">
            <button class="stat-adding-button" id="add-team-playoffs-button">Add Team Playoffs</button>
        </a>
    </div>

    <div id="stat-adding-container">
        <div id="stat-fields-container">
            <div class="stat-field">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
            </div>
            <div class="stat-field">
                <label for="team">Team:</label>
                <input type="text" id="team" name="team">
            </div>
            <div class="stat-field">
                <label for="number">Number:</label>
                <input type="text" id="number" name="number">
            </div>
            <div class="stat-field">
                <label for="position">Position:</label>
                <input type="text" id="position" name="position">
            </div>
            <div class="stat-field">
                <label for="height">Height:</label>
                <input type="text" id="height" name="height">
            </div>
            <div class="stat-field">
                <label for="weight">Weight:</label>
                <input type="text" id="weight" name="weight">
            </div>
            <div class="stat-field">
                <label for="birthday">Birthday:</label>
                <input type="text" id="birthday" name="birthday">
            </div>
            <div class="stat-field">
                <label for="handedness">Handedness:</label>
                <input type="text" id="handedness" name="handedness">
            </div>
            <div class="stat-field">
                <label for="draft-position">Draft Position:</label>
                <input type="text" id="draft-position" name="draft-position">
            </div>
        </div>
        
        <a href="/add-skater-regular-season.html">
            <button id="add-skater-regular-season-button" class="add-season-button" onclick="addSkaterStats()">Add Regular Season</button>
        </a>
        
        <a href="/add-skater-playoffs.html">
            <button id="add-skater-playoffs-button" class="add-season-button" onclick="addSkaterStats()">Add Playoffs</button>
        </a>
        
        <button class="edit-button" id="edit-player-button" onclick="editSkater()">Edit Player</button>
        <button class="confirm-button" onclick="finishSkater()">Submit Player</button>
    </div>    
</body>
</html>
