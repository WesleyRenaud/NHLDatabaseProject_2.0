<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL DB</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../scripts/scripts.js" defer></script>
</head>
<body>
    <div id="top-container">
        <h1 id="nhl-db-title">NHL DB</h1>
        <div id="view-stats-button-container">
            <a href="/view-stats.html">
                <button id="view-stats-button">View Stats</button>
            </a>
        </div>
    </div>

    <div id="stat-adding-button-container">
        <a href="/add-skater.html">
            <button class="stat-adding-button" id="add-skater-button">Add Skater</button>
        </a>
        <a href="/add-goalie.html">
            <button class="stat-adding-button" id="add-goalie-button">Add Goalie</button>
        </a>        
        <a href="/add-team-regular-season.html">
            <button class="stat-adding-button" id="add-team-regular-season-button">Add Team Season</button>
        </a>
        <a href="/add-team-playoffs.html">
            <button class="stat-adding-button" id="add-team-playoffs-button">Add Team Playoffs</button>
        </a>
    </div>

    <div id="stat-adding-container">
        <div id="stat-fields-container">
            <div class="stat-field">
                <label for="season">Season:</label>
                <input type="text" id="season" name="season">
            </div>
            <div class="stat-field">
                <label for="city">City:</label>
                <input type="text" id="city" name="city">
            </div>
            <div class="stat-field">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
            </div>
            <div class="stat-field">
                <label for="games-played">Games Played:</label>
                <input type="text" id="games-played" name="games-played">
            </div>
            <div class="stat-field">
                <label for="wins">Wins:</label>
                <input type="text" id="wins" name="wins">
            </div>
            <div class="stat-field">
                <label for="losses">Losses:</label>
                <input type="text" id="losses" name="losses">
            </div>
            <div class="stat-field">
                <label for="ties">Ties:</label>
                <input type="text" id="ties" name="ties">
            </div>
            <div class="stat-field">
                <label for="overtime-losses">Overtime Losses:</label>
                <input type="text" id="overtime-losses" name="overtime-losses">
            </div>
            <div class="stat-field">
                <label for="points">Points:</label>
                <input type="text" id="points" name="points">
            </div>
            <div class="stat-field">
                <label for="points-percentage">Points Percentage:</label>
                <input type="text" id="points-percentage" name="points-percentage">
            </div>
            <div class="stat-field">
                <label for="regulation-wins">Regulation Wins:</label>
                <input type="text" id="regulation-wins" name="regulation-wins">
            </div>
            <div class="stat-field">
                <label for="regulation-and-overtime-wins">Regulation/Overtime Wins:</label>
                <input type="text" id="regulation-and-overtime-wins" name="regulation-and-overtime-wins">
            </div>
            <div class="stat-field">
                <label for="goals-for">Goals For:</label>
                <input type="text" id="goals-for" name="goals-for">
            </div>
            <div class="stat-field">
                <label for="goals-against">Goals Against:</label>
                <input type="text" id="goals-against" name="goals-against">
            </div>
            <div class="stat-field">
                <label for="goal-differential">Goal Differential:</label>
                <input type="text" id="goal-differential" name="goal-differential">
            </div>
            <div class="stat-field">
                <label for="home">Home:</label>
                <input type="text" id="home" name="home">
            </div>
            <div class="stat-field">
                <label for="away">Away:</label>
                <input type="text" id="away" name="away">
            </div>
            <div class="stat-field">
                <label for="shootout">Shootout:</label>
                <input type="text" id="shootout" name="shootout">
            </div>
            <div class="stat-field">
                <label for="last-10">Last 10:</label>
                <input type="text" id="last-10" name="last-10">
            </div>
            <div class="stat-field">
                <label for="streak">Streak:</label>
                <input type="text" id="streak" name="streak">
            </div>
            <div class="stat-field">
                <label for="shootout-wins">Shootout Wins:</label>
                <input type="text" id="shootout-wins" name="shootout-wins">
            </div>
            <div class="stat-field">
                <label for="goals-for-per-game">Goals For/Game:</label>
                <input type="text" id="goals-for-per-game" name="goals-for-per-game">
            </div>
            <div class="stat-field">
                <label for="goals-against-per-game">Goals Against/Game:</label>
                <input type="text" id="goals-against-per-game" name="goals-against-per-game">
            </div>
            <div class="stat-field">
                <label for="powerplay-percentage">Powerplay Percentage:</label>
                <input type="text" id="powerplay-percentage" name="powerplay-percentage">
            </div>
            <div class="stat-field">
                <label for="penalty-kill-percentage">Penalty Kill Percentage:</label>
                <input type="text" id="penalty-kill-percentage" name="penalty-kill-percentage">
            </div>
            <div class="stat-field">
                <label for="net-powerplay-percentage">Net Powerplay Percentage:</label>
                <input type="text" id="net-powerplay-percentage" name="net-powerplay-percentage">
            </div>
            <div class="stat-field">
                <label for="net-penalty-kill-percentage">Net Penalty Kill Percentage:</label>
                <input type="text" id="net-penalty-kill-percentage" name="net-penalty-kill-percentage">
            </div>
            <div class="stat-field">
                <label for="faceoff-win-percentage">Faceoff Win Percentage:</label>
                <input type="text" id="faceoff-win-percentage" name="faceoff-win-percentage">
            </div>
        </div>

        <button class="edit-button" id="edit-team-button" onclick="editTeam('Regular Season')">Edit Team</button>
        <button class="confirm-button" onclick="finishTeam('Regular Season')">Confirm</button>
    </div>
</body>
</html>
