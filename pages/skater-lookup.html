<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL DB</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../scripts/scripts.js" defer></script>
</head>
<body>
    <div id="top-container">
        <h1 id="nhl-db-title">NHL DB</h1>
        <div id="add-stats-button-container">
            <a href="/add-stats.html">
                <button id="add-stats-button">Add Stats</button>
            </a>
        </div>
    </div>

    <div id="stat-viewing-button-container">
        <a href="/skater-season-stats.html">
            <button class="stat-viewing-button" id="skater-season-stats-button">Skater Season Stats</button>
        </a>
        <a href="/skater-playoff-stats.html">
            <button class="stat-viewing-button" id="skater-playoff-stats-button">Skater Playoff Stats</button>
        </a>
        <a href="/goalie-season-stats.html">
            <button class="stat-viewing-button" id="goalie-season-stats-button">Goalie Season Stats</button>
        </a>
        <a href="/goalie-playoff-stats.html">
            <button class="stat-viewing-button" id="goalie-playoff-stats-button">Goalie Playoff Stats</button>
        </a>        
        <a href="/skater-lookup.html">
            <button class="stat-viewing-button" id="skater-lookup-button">Skater Lookup</button>
        </a>
        <a href="/goalie-lookup.html">
            <button class="stat-viewing-button" id="goalie-lookup-button">Goalie Lookup</button>
        </a>
        <a href="/standings.html">
            <button class="stat-viewing-button" id="standings-button">Standings</button>
        </a>
        <a href="/team-season-stats.html">
            <button class="stat-viewing-button" id="team-season-stats-button">Team Season Stats</button>
        </a>
        <a href="/team-playoff-stats.html">
            <button class="stat-viewing-button" id="team-playoff-stats-button">Team Playoff Stats</button>
        </a>
        <a href="/team-lookup.html">
            <button class="stat-viewing-button" id="team-lookup-button">Team Lookup</button>
        </a>
    </div>
    
    <div id="stats-container">
        <div id="stat-selecting-container">
        </div>
        <div id="stat-viewing-container">
            <button id="season-type-change-button" onclick="searchSkaterToggleType()">Playoffs</button>

            <div id="search-bar-container">
                <span class="search-icon">&#128269;</span> <!-- Unicode search icon -->
                <input type="text" id="search-bar" placeholder="...">
            </div>            
        </div>        
    </div>    
</body>
</html>
